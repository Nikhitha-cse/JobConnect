<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Details - JobConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">
    <div class="container nav-content">
        <div class="logo">JobConnect</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs">Jobs</a>
            <a href="#">Login</a>
        </div>
    </div>
</nav>

<div class="job-details">

    <h1 th:text="${job.title}">Job Title</h1>

    <h2 th:text="${job.company}">Company</h2>

    <p>
        📍 Location:
        <span th:text="${job.location}">Location</span>
    </p>

    <p>
        💰 Salary:
        <span th:text="${job.salary}">Salary</span>
    </p>

	<a th:href="@{/jobs/{id}/apply(id=${job.id})}" class="apply-btn">
	    Apply Now
	</a>

</div>

</body>
</html>
